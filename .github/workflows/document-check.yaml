# Fails if NAMESPACE or man/ are out of sync with the roxygen comments.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: document-check

permissions: read-all

jobs:
  document-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # keep in sync with RoxygenNote in DESCRIPTION
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: roxygen2@7.3.3, any::pkgload, any::Rcpp

      - name: Regenerate RcppExports and documentation
        run: |
          Rcpp::compileAttributes()
          roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check for uncommitted changes
        run: |
          git status --porcelain -- NAMESPACE man R/RcppExports.R src/RcppExports.cpp
          git diff --exit-code -- NAMESPACE man R/RcppExports.R src/RcppExports.cpp
